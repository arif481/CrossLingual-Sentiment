# Cross-Lingual Sentiment Analysis Configuration
# =============================================

# Model Configuration
model:
  default_model: "FacebookAI/xlm-roberta-base"
  num_labels: 2
  max_length: 128
  dropout: 0.1
  label2id:
    negative: 0
    positive: 1
  id2label:
    0: "negative"
    1: "positive"

# Dataset Configuration
datasets:
  english:
    # SST-2 test labels are hidden, so the official validation split (872
    # sentences) is our English test set and val_size of train is held out
    # for checkpoint selection.
    name: "sst2"
    hf_dataset_id: "nyu-mll/glue"
    hf_subset: "sst2"
    text_column: "sentence"
    label_column: "label"
    val_size: 0.05
  bengali:
    # SentNoB (Islam et al., Findings of EMNLP 2021): Bangla social media
    # comments, 0 = neutral, 1 = positive, 2 = negative. We use the paper's
    # train/val/test files and drop neutral comments.
    name: "sentnob"
    hf_dataset_id: "khondoker/SentNoB"
    files:
      train: "Train.csv"
      val: "Val.csv"
      test: "Test.csv"
    text_column: "Data"
    label_column: "Label"
    label_map:
      1: 1
      2: 0

# Language Configuration
languages:
  - en
  - bn

# Training Configuration
# Evaluation and checkpoint selection happen once per epoch, on the
# validation data of the training language(s) only.
training:
  seed: 42
  batch_size: 32
  eval_batch_size: 64
  epochs: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  fp16: true
  logging_steps: 100
  early_stopping_patience: 2
  metric_for_best_model: "f1"
  greater_is_better: true

# Data Split Configuration
data_split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  output_dir: "experiments"
  models_dir: "models"
  logs_dir: "logs"

# Experiment Modes
# Every mode is tested on both English and Bengali; eval_languages are the
# languages the mode is meant to be judged on.
experiments:
  zero_shot:
    train_languages: ["en"]
    eval_languages: ["bn"]
    description: "Train on English, evaluate on Bengali"
  low_resource:
    train_languages: ["bn"]
    eval_languages: ["bn"]
    description: "Train and evaluate on Bengali only"
  combined:
    train_languages: ["en", "bn"]
    eval_languages: ["en", "bn"]
    description: "Train on combined data, evaluate on both"

# Hugging Face Hub Configuration
huggingface:
  repo_name: "crosslingual-sentiment-model"
  space_name: "crosslingual-demo"
  model_card_template: |
    ---
    language:
      - en
      - bn
    tags:
      - sentiment-analysis
      - cross-lingual
      - xlm-roberta
    datasets:
      - nyu-mll/glue
      - khondoker/SentNoB
    metrics:
      - accuracy
      - f1
    ---
    
    # Cross-Lingual Sentiment Analysis Model
    
    This model performs binary sentiment classification (positive/negative) 
    across English and Bengali languages using XLM-RoBERTa.

# Baseline Configuration
baseline:
  max_features: 50000
  ngram_range: [1, 2]
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
