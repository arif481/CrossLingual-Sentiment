# Cross-Lingual Sentiment Analysis Configuration
# =============================================

# Model Configuration
model:
  default_model: "xlm-roberta-base"
  num_labels: 2
  max_length: 128
  dropout: 0.1
  label2id:
    negative: 0
    positive: 1
  id2label:
    0: "negative"
    1: "positive"

# Dataset Configuration
datasets:
  english:
    name: "sst2"
    source: "huggingface"
    hf_dataset_id: "glue"
    hf_subset: "sst2"
    text_column: "sentence"
    label_column: "label"
  bengali:
    name: "bengali_sentiment"
    source: "huggingface"
    hf_dataset_id: "sepidmnorozy/Bengali_sentiment"
    text_column: "text"
    label_column: "sentiment"
    fallback_kaggle: "kazanova/sentiment140"

# Language Configuration
languages:
  - en
  - bn

# Training Configuration
training:
  seed: 42
  batch_size: 16
  eval_batch_size: 32
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  fp16: true
  eval_steps: 500
  save_steps: 500
  logging_steps: 100
  save_total_limit: 3
  early_stopping_patience: 3
  metric_for_best_model: "f1"
  greater_is_better: true

# Data Split Configuration
data_split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  output_dir: "experiments"
  models_dir: "models"
  logs_dir: "logs"

# Experiment Modes
experiments:
  zero_shot:
    train_languages: ["en"]
    eval_languages: ["bn"]
    description: "Train on English, evaluate on Bengali"
  low_resource:
    train_languages: ["bn"]
    eval_languages: ["bn"]
    description: "Train and evaluate on Bengali only"
  combined:
    train_languages: ["en", "bn"]
    eval_languages: ["en", "bn"]
    description: "Train on combined data, evaluate on both"

# Hugging Face Hub Configuration
huggingface:
  repo_name: "crosslingual-sentiment-model"
  space_name: "crosslingual-demo"
  model_card_template: |
    ---
    language:
      - en
      - bn
    tags:
      - sentiment-analysis
      - cross-lingual
      - xlm-roberta
    datasets:
      - glue
      - sepidmnorozy/Bengali_sentiment
    metrics:
      - accuracy
      - f1
    ---
    
    # Cross-Lingual Sentiment Analysis Model
    
    This model performs binary sentiment classification (positive/negative) 
    across English and Bengali languages using XLM-RoBERTa.

# Baseline Configuration
baseline:
  max_features: 50000
  ngram_range: [1, 2]
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
